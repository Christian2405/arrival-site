<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: matched to the reference site's measured values. A 1200px nav row with the wordmark at the left, then one 700px centered block: 56px bold serif headline, 18px muted sentence, dark 6px-radius button, a hairline divider, and a row of two bold serif contact items split by a 40px vertical rule. A second view is a blank "Coming soon" page. Committed single light look. */
:root {
  --bg: #FFFFFF;
  --ink: #2A2622;
  --muted: #7C736A;
  --line: #DDD9D5;
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
p { margin: 0; }

.nav-inner { max-width: 1200px; margin: 0 auto; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; height: 80px; text-decoration: none; }
.logo { height: 25px; width: auto; display: block; margin-left: 4px; }

.section { padding: 120px 40px; }
.hero { max-width: 700px; margin: 0 auto; text-align: center; }
h1 { margin: 0 0 24px; font: 700 3.5rem/1.2 var(--font-display); text-wrap: balance; }
.hero-sub { margin: 0 0 32px; font-size: 1.125rem; line-height: 1.7; color: var(--muted); }
.ctas { display: flex; justify-content: center; margin-bottom: 32px; }
.btn { display: block; font: 600 1rem/1.6 var(--font-body); text-decoration: none; background: var(--ink); color: #FFFFFF; padding: 16px 32px; border-radius: 6px; transition: transform .15s ease; }
.btn:hover { transform: translateY(-2px); }

.stats { margin-top: 48px; padding-top: 40px; border-top: 1px solid var(--line); display: flex; justify-content: center; align-items: center; gap: 32px; }
.stat { font: 700 1.25rem/1.6 var(--font-display); color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.stat:hover { text-decoration: underline; }
.stat-divider { width: 1px; height: 40px; background: var(--line); flex: none; }

.soon h1 { margin: 0; }

@media (max-width: 768px) {
  .nav-inner { padding: 12px 24px; }
  .section { padding: 80px 24px; }
  h1 { font-size: 2rem; }
  .hero-sub { font-size: 1rem; }
  .stats { flex-direction: column; gap: 12px; }
  .stat-divider { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  var views = ['home', 'portfolio'];
  function show(name) {
    if (views.indexOf(name) < 0) name = 'home';
    views.forEach(function (v) { document.getElementById('view-' + v).hidden = v !== name; });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-view]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      var name = el.getAttribute('data-view');
      show(name);
      try { history.replaceState(null, '', '#' + name); } catch (err) { /* hash is optional */ }
    });
  });
  window.addEventListener('hashchange', function () { show((location.hash || '').slice(1)); });
  show((location.hash || '').slice(1));
})();
</script>
